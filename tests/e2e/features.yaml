# Feature-flag allowlist for gotit specs.
# Override via env: GRAPH_HARNESS_E2E_FEATURES=foo,bar  (or =all)
# Unknown flags evaluate to false (skip).

enabled:
  # ---- Phase 0 sub-flags ----
  p0-named-pipe:           false   # Windows daemon socket; soft-gated in P0
  p0-vscode-extension:     false   # vsce required; gate when authoring runs in CI

  # ---- Cross-phase gating (flip in the PR that ships the feature) ----
  p1-multi-language:       true
  # P1 production extractor wiring (T-extractors, e31a8f7+):
  # indexWorkspaceCode now routes every available source (tree-sitter +
  # SCIP from .scip-index/ + LSP behind GRAPH_HARNESS_ENABLE_LSP=1)
  # through code_core.Unifier so each entity carries
  # provenance.sources[]. The --no-lsp / --no-scip / --no-treesitter
  # flags ride alongside selectors test, validate-diff, code provenance,
  # code list, and code events so build-order-tolerance specs can
  # exercise single-source modes.
  p1-extractor-wiring:     true
  # P2 framework extractors — SHIPPED and wave-green. The full chain
  # works end-to-end in both daemon and batch modes:
  #   * 37 extractors register via init() (extractors/all aggregator);
  #   * the code.framework Dispatcher runs in `daemon serve` AND in the
  #     batch index path (internal/cli/workspace.go), so
  #     `code list` / `validate-diff` / `selectors test` materialize
  #     framework entities with or without a running daemon;
  #   * the EntityWriter projects extractor emissions into queryable
  #     code_core rows (transport-prefixed event keys, composite
  #     "<METHOD> <path>" route keys) + reverse-index bindings;
  #   * change.process Stage 2 marks framework producers in a touched
  #     directory, so an event-payload struct change fires
  #     `missing_dependent_update` listing the cross-language
  #     subscribers + contract test with their file paths (plan §4);
  #   * the kindwise / route_pattern / event_name / topic_name /
  #     schema_field anchors resolve against the materialized rows.
  # All 17 ungated phase2 specs under tests/e2e/specs/phase2/ assert
  # the exact extracted entity set and pass; the 5 specs below stay
  # gated on features that are genuinely post-P2.
  p2-framework-extractors: true
  # OpenAPI extractor is post-v1 per plan/02-framework-extractors.md §6
  # ("Beyond the v1 extractor set ... — post-v1"). Spec authored ahead
  # under tests/e2e/specs/phase2/extractors-schemas/ — flip to true
  # when the OpenAPI parser lands.
  p2-openapi:              false
  # Prefix joining for chi/gin/gorilla group routes ("/api" + "/users"
  # → "/api/users") is deferred to Pass-2 enrichment with code.core
  # group-context tracking per extractors/route/go/README.md. Today
  # extractors emit the raw nested paths; the joined-paths companion
  # spec is gated behind this flag.
  p2-route-prefix-joining: false
  # The change.process pipeline ships
  # `missing_dependent_update` in Pass-2; the per-producer-kind
  # specialized finding kinds below are authored ahead of their
  # FindingKind* constants landing in
  # internal/change_process/pipeline.go. Flip each when the
  # corresponding kind ships.
  p2-route-missing-test-finding:    false
  p2-event-orphaned-finding:        false
  p2-schema-field-removal-finding:  false
  p3-rule-engine:          false
  p3-repair-instructions:  false
  p4-full-review-states:   false
  p5-history-evolution:    false
  p6-perf-bench:           false
  p6-publish:              false
  p6-hidden-corpus:        false

  # ---- Phase 0.5 (always-on substrate, plan/00.5-always-on-substrate.md) ----
  # All landed in impl/phase0.5 commits e0be993..40f4347. Specs under
  # tests/e2e/specs/substrate/ exercise the user-visible substrate
  # contracts via the CLI surface (`daemon subscribe`, `--batch`,
  # `validate-diff`, `selectors test` round-trips).
  p0.5-watcher-wired:        true   # P0.5.T07 daemon owns fsnotify → orchestrator
  p0.5-subscription-push:    true   # P0.5.T01-T06 kernel.subscribe + lifecycle + multiplex
  p0.5-batch-mode:           true   # P0.5.T16 --batch flag opens SQLite read-only
  p0.5-transient-tier:       true   # P0.5.T12 TransientOverlay (subscriber-scoped)
  p0.5-router:               true   # P0.5.T13 Kernel.Route as single read seam
  p0.5-cancellation:         true   # P0.5.T14 kernel.cancel + per-request ctx
  p0.5-hydration-parity:     true   # P0.5.T10/T11 cold-restart equals live observation
  p0.5-suppress-at-source:   true   # P0.5.T09 zero-event no-op re-extract
  p0.5-trust-enforced:       true   # P0.5.T18 WriteToken + kernel_seq_tag column
  p0.5-daemon-canonical-cli: true   # P0.5.T15 interactive CLI lowers through daemon

  # ---- Phase 1.5 (multi-language substrate closure, plan/01.5-multi-language-substrate-closure.md) ----
  # Multi-language fan-out of P0.5 substrate. F3 (PR phase-0-thru-1.5-closure)
  # corrected T02 — publishDiagnostics drives a re-extract through the existing
  # typed-drift pipeline; no synthetic LSPNotification event kind. Per
  # plan/answers/02 + /06 the canonical event taxonomy is the four typed
  # drift kinds + FileChanged/FileRemoved.
  p1.5-multi-lang-watcher:        true   # P1.5.T01 watcher routes Go/TS/Py through daemon orchestrator
  p1.5-lsp-pushback:              true   # P1.5.T02 (F3) LSP publishDiagnostics drives re-extract via Unifier
  p1.5-multi-source-suppress:     true   # P1.5.T03 multi-source compare-before-emit zero-event re-extract
  p1.5-cli-breadth:               true   # P1.5.T06 remaining interactive commands route through daemon
  p1.5-trust-strict:              true   # P1.5.T07 TrustPolicy.SetStrict(true) at daemon boot
  p1.5-rebuild-from-snapshot:     true   # P1.5.T08 kernel.rebuildFromSnapshot recovery path
  p1.5-transient-overlay-cli:     true   # P1.5.T09 daemon publish-transient / get-transient CLI
  p1.5-eviction-loop-wired:       true   # P1.5.T10 SubscriptionManager.StartEvictionLoop at serve boot
  p1.5-eviction-e2e:              false  # F17 e2e variant; gated off due to CI timing flakiness, unit test eviction_test.go covers contract

  # ---- Tooling availability flags (workaround for gotit ≤0.2.1) ----
  # The gotit TUI pre-flight (cmd/gotit/tui_cmd.go::runTUI) only
  # short-circuits to StateSkipped for `feature:` and `git` requires —
  # PATH-based custom requires (pyright, scip-go, scip-typescript,
  # scip-python) are checked inside the spawned `go test` subprocess
  # via testdriver.Run. That subprocess writes a one-line
  # spec_end{skipped:true} record and exits within ~1ms; the TUI's
  # tail (tui/runtime.go::SpawnGoTest) has a 250ms drain window with a
  # 50ms-poll TailJSONL goroutine, and the `select` between
  # tailEvents and drainDeadline races so the lone spec_end line can
  # be lost. Affected specs then sit at StateRunning forever.
  #
  # We pre-gate with a feature flag of the same name so the TUI's
  # pre-flight catches the skip and marks state without ever spawning.
  # Headless `gotit run` and `go test ./tests/e2e` honor whichever path
  # is checked first; both paths agree on the skip outcome.
  #
  # Flip these to true (or set GRAPH_HARNESS_E2E_FEATURES=have-pyright,
  # have-scip-go,...) when the tool IS installed locally so the
  # corresponding spec actually runs through the PATH-based requirement
  # check at testdriver time.
  have-gopls:           true   # gopls is on PATH on this host
  have-tsserver:        true   # typescript-language-server is on PATH
  have-pyright:         true   # pyright-langserver via pipx (~/.local/share/pipx/venvs/pyright)
  have-scip-go:         true   # scip-go on PATH (~/go/bin/scip-go)
  have-scip-typescript: true   # scip-typescript on PATH (mise node)
  have-scip-python:     true   # scip-python on PATH (mise node)

  # ---- Architectural gates (flip when the corresponding gap closes) ----
  # SymbolDisambiguation events fire when ≥2 sources produce different
  # §6.12 canonical IDs at the SAME locKey (path + byte-range + kind).
  # In the current production wiring this can't happen for Go because:
  #   1. LSP Function/Method symbols are stripped by the orchestrator's
  #      filterOutFunctions (internal/extract/orchestrator.go ~250-270);
  #      gopls's signature normalization differs from tree-sitter's, so
  #      their MethodIDs diverge and the unifier emits two entities. The
  #      filter is the workaround until per-language signature alignment
  #      lands (P2 polish).
  #   2. scip-go encodes line numbers but no byte offsets, so SCIP-imported
  #      Symbols have Range{StartByte:0, EndByte:0} (internal/source_live
  #      /scip/import.go::scipRange). Their locKey can never collide with
  #      tree-sitter's byte-keyed locKey, so cross-source disambiguation
  #      between SCIP and tree-sitter never groups together.
  #   3. scip-go does not emit signature info, so all SCIP MethodIDs for
  #      a given (recv, name) collapse to one ID — even two SCIP indexes
  #      capturing different source states produce identical IDs.
  # Property test internal/code_core/unify_test.go::TestConflictAsEvent
  # exercises the disambiguation mechanism with synthetic inputs and is
  # green; the e2e spec needs at least one of (1)-(3) closed.
  cross-source-disagreement-emits-event: false
