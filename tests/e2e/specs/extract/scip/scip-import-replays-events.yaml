# yaml-language-server: $schema=https://github.com/shivamstaq/gotit/raw/main/schema/spec.schema.json
spec_version: 1
name: scip-import-replays-events
description: >
  Plan §7 phase1/source-live/ requires a spec proving the SCIP wire-format
  import path lands code.core entities + provenance. This spec stages the
  canonical fixture committed at tests/testdata/scip/sample.scip into a
  workspace's .scip-index/ directory and asserts that:

    1. The orchestrator's PreloadSCIP discovers the index file.
    2. The Go importer translates SymbolInformation + Occurrence rows into
       source_live.Symbol envelopes that the unifier writes as code.core
       entities (Validator type, Validator.Validate method, Helper
       function — see tests/testdata/scip/README.md for fixture details).
    3. Each materialized entity carries an `index_scip` provenance row
       with extractor:scip:scip-go as the producer.

  No external tooling required — the static blob sidesteps the scip-go
  install dance per SPEC §6.17 ("Build-our-own — SCIP wire-format reader").
tags: [extract, scip, p1t10]
order: 14
requires:
  - cgo
  - tree-sitter
  - feature:p1-multi-language
  - feature:p1-extractor-wiring
repo:
  # Helper pre-stages the canonical SCIP wire-format fixture (the same
  # blob committed at tests/testdata/scip/sample.scip) under
  # `.scip-index/checkout.scip`. The fixture's document path
  # (pkg/checkout/validator.go) deliberately differs from the helper's
  # source tree (internal/checkout/) so SCIP-imported entities don't
  # collide with tree-sitter ones — the source attribution stays
  # unambiguous in the assertions below.
  helper: go-module-with-checkout-validator-and-scip-index

setup:
  - name: init_workspace
    command: graph-harness init
    assert: [{ type: exit_code, expected: 0 }]
  - name: install_overlay
    command: sh -c "mkdir -p .graph-harness/overlay && cp demo.checkout.gh .graph-harness/overlay/checkout.gh"
    assert: [{ type: exit_code, expected: 0 }]

steps:
  # SCIP-only ingestion: assert the importer materialised the three
  # symbols from the fixture. --no-treesitter --no-lsp keeps the
  # source attribution unambiguous so the provenance assertion below
  # is a clean canary.
  - name: scip_imports_validator_method
    command: graph-harness code provenance "checkout.Validator.Validate" --no-treesitter --no-lsp --json
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: '"qualified_name":"checkout.Validator.Validate"' }
      - { type: contains, value: '"language_id":"go"' }
      - { type: contains, value: '"source_class":"index_scip"' }
      - { type: contains, value: '"produced_by":"extractor:scip:scip-go"' }

  - name: scip_imports_helper_function
    command: graph-harness code provenance "checkout.Helper" --no-treesitter --no-lsp --json
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: '"qualified_name":"checkout.Helper"' }
      - { type: contains, value: '"source_class":"index_scip"' }

  # The Validator type symbol from the fixture also lands as a class /
  # type-decl entity; the importer maps SCIP's Struct kind into our
  # SymbolKindClass.
  - name: scip_imports_validator_type
    command: graph-harness code list --no-treesitter --no-lsp --json
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: '"qualified_name":"checkout.Validator"' }
