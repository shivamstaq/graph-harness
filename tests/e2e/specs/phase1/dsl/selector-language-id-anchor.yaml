# yaml-language-server: $schema=https://github.com/shivamstaq/gotit/raw/main/schema/spec.schema.json
spec_version: 1
name: selector-language-id-anchor
description: >
  Plan §7: a selector with `anchor language_id "<lang>"` filters resolution
  to entities tagged with that language. The polyglot fixture has entities
  in Go, TypeScript, and Python under their own qualified-name namespaces
  (parser-emitted qualified names include the module path); the spec
  verifies the filter narrows resolution to the requested language even
  when other anchors also apply.
  Two scenarios:
  (a) `language_id "typescript"` + qualified_name pointing at the TS entity
      → outcome=bound, only the TS entity returned, trace shows the
      filter rung.
  (b) `language_id "go"` + qualified_name pointing at the TS entity
      → outcome=unresolved (the TS-tagged entity is filtered out, no Go
      entity has that qualified name).
tags: [phase1, dsl, language-id]
order: 25
requires:
  - cgo
  - tree-sitter
  - feature:p1-multi-language
repo:
  helper: polyglot-repo-go-ts-py

setup:
  - name: init_workspace
    command: graph-harness init
    assert: [{ type: exit_code, expected: 0 }]
  - name: install_overlay
    command: |
      bash -c '
      mkdir -p .graph-harness/overlay
      cat > .graph-harness/overlay/checkout.gh << "GHEOF"
      selector ValidatorTS {
        anchor qualified_name "validator.CheckoutValidator.validate"
        anchor language_id "typescript"
      }

      selector ValidatorWantsGoButTSEntity {
        anchor qualified_name "validator.CheckoutValidator.validate"
        anchor language_id "go"
      }

      selector ValidatorAny {
        anchor qualified_name "validator.CheckoutValidator.validate"
      }
      GHEOF
      '
    assert: [{ type: exit_code, expected: 0 }]

steps:
  - name: language_id_ts_filter_returns_ts_entity
    command: graph-harness selectors test ValidatorTS --json --explain
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "\"outcome\":\"bound\"" }
      - { type: contains, value: "\"language_id\":\"typescript\"" }
      - { type: contains, value: "\"kind\":\"language_id\"" }
      - { type: contains, value: "filter active" }

  - name: language_id_go_filter_excludes_ts_entity
    command: graph-harness selectors test ValidatorWantsGoButTSEntity --json --explain
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "\"outcome\":\"unresolved\"" }
      - { type: contains, value: "language_id filter" }

  - name: without_filter_resolves_unconstrained
    # No language_id → resolution proceeds normally; the spec just asserts
    # the trace does NOT show a language_id rung.
    command: graph-harness selectors test ValidatorAny --explain
    assert:
      - { type: exit_code, expected: 0 }
      - { type: not_contains, value: "language_id" }
