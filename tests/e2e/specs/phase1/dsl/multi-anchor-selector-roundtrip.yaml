# yaml-language-server: $schema=https://github.com/shivamstaq/gotit/raw/main/schema/spec.schema.json
spec_version: 1
name: dsl-multi-anchor-selector-roundtrip
description: >
  P1.E: the DSL accepts the full multi-anchor surface — qualified_name,
  function_signature sig(...), body_hash, call_neighborhood {…}, ast_hash,
  symbol_fingerprint, path_glob (as `fallback`), plus the thresholds {…}
  block — and renders back to canonical .gh that re-parses cleanly.
tags: [phase1, dsl, p1t21, p1t22, p1t23, p1t24]
order: 10
features: [p1-multi-language]
repo:
  helper: go-module-empty

setup:
  - name: init_workspace
    command: graph-harness init
    assert:
      - { type: exit_code, expected: 0 }

steps:
  - name: query_accepts_function_signature_anchor
    command: graph-harness query 'selector S { anchor function_signature sig(Money, Card) -> AuthResult }'
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "function_signature" }
      - { type: contains, value: "sig(Money, Card)" }
      - { type: contains, value: "AuthResult" }

  - name: query_accepts_call_neighborhood_anchor
    command: |
      graph-harness query 'selector S { anchor call_neighborhood { callers: ["A.x"] callees: ["B.y", "C.z"] } }'
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "call_neighborhood" }
      - { type: contains, value: "callers" }
      - { type: contains, value: "callees" }

  - name: query_accepts_thresholds_block
    command: |
      graph-harness query 'selector S { anchor qualified_name "x.Y" thresholds { bound: 0.95 reanchored: 0.75 ambiguous_zone: [0.55, 0.75] } }'
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "thresholds" }
      - { type: contains, value: "bound: 0.95" }
      - { type: contains, value: "ambiguous_zone: [0.55, 0.75]" }

  - name: query_accepts_fallback_marker_for_path_glob
    command: graph-harness query 'selector S { anchor qualified_name "x.Y" fallback path_glob "src/**/*.go" }'
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "fallback path_glob" }
