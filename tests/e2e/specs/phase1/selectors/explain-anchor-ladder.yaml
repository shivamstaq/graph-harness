# yaml-language-server: $schema=https://github.com/shivamstaq/gotit/raw/main/schema/spec.schema.json
spec_version: 1
name: selectors-explain-anchor-ladder
description: >
  P1.F + plan §3 gate criterion 8: `graph-harness selectors test --explain`
  prints the per-anchor evaluation trace including which anchor matched,
  the score for each rung, and which lower-priority anchors were not
  consulted because an earlier anchor satisfied its threshold.
  Two scenarios are covered:
  (a) primary qualified_name wins → outcome=bound, fallback rungs marked
      "not consulted: earlier anchor satisfied threshold"
  (b) primary qualified_name misses (stale name in the overlay) → fallback
      function_signature wins → outcome=reanchored, with the primary's miss
      and the fallback's score visible in the trace.
tags: [phase1, selectors, p1t29, gate-criterion-8]
order: 20
requires:
  - cgo
  - tree-sitter
  - feature:p1-multi-language
repo:
  helper: go-module-with-checkout-validator

setup:
  - name: init_workspace
    command: graph-harness init
    assert:
      - { type: exit_code, expected: 0 }

  - name: install_primary_wins_overlay
    # CheckoutValidatorPrimary uses the correct qualified_name → bound.
    # CheckoutValidatorStale uses a wrong qualified_name → must fall through
    # to function_signature → reanchored.
    command: |
      bash -c '
      mkdir -p .graph-harness/overlay
      cat > .graph-harness/overlay/checkout.gh << "GHEOF"
      selector CheckoutValidatorPrimary {
        anchor qualified_name "checkout.CheckoutValidator.Validate"
        anchor function_signature sig(any) -> error
        anchor body_hash "sha256:never-matches"
      }

      selector CheckoutValidatorStale {
        anchor qualified_name "checkout.CheckoutValidator.NameThatDoesNotExist"
        anchor function_signature sig(any) -> error
        anchor body_hash "sha256:never-matches"
      }
      GHEOF
      '
    assert:
      - { type: exit_code, expected: 0 }

steps:
  - name: primary_wins_explain_shows_bound_and_skipped_rungs
    command: graph-harness selectors test CheckoutValidatorPrimary --explain
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "anchor ladder" }
      - { type: contains, value: "qualified_name" }
      - { type: contains, value: "outcome:    bound" }
      # Lower-priority anchors must show up as "not consulted".
      - { type: contains, value: "not consulted" }

  - name: primary_wins_json_trace_round_trips
    command: graph-harness selectors test CheckoutValidatorPrimary --explain --json
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "\"trace\"" }
      - { type: contains, value: "\"kind\":\"qualified_name\"" }
      - { type: contains, value: "\"outcome_when_taken\":\"bound\"" }
      - { type: contains, value: "\"skipped\":true" }

  - name: stale_primary_falls_through_to_function_signature
    # When the primary's qualified_name is stale, the resolver evaluates
    # function_signature next. The trace must show:
    #   - qualified_name skipped with "no candidates matched"
    #   - function_signature scored 0.85 → outcome=reanchored
    #   - body_hash marked "not consulted"
    command: graph-harness selectors test CheckoutValidatorStale --explain
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "outcome:    reanchored" }
      - { type: contains, value: "no candidates" }
      - { type: contains, value: "fallback scored 0.85" }
      - { type: contains, value: "not consulted" }

  - name: stale_primary_json_trace_records_full_ladder
    command: graph-harness selectors test CheckoutValidatorStale --explain --json
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "\"outcome\":\"reanchored\"" }
      - { type: contains, value: "\"via_anchor\":\"function_signature\"" }
      # Trace must include all three anchors with the expected dispositions.
      - { type: contains, value: "\"kind\":\"qualified_name\"" }
      - { type: contains, value: "\"kind\":\"function_signature\"" }
      - { type: contains, value: "\"kind\":\"body_hash\"" }
