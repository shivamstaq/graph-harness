# yaml-language-server: $schema=https://github.com/shivamstaq/gotit/raw/main/schema/spec.schema.json
spec_version: 1
name: reanchor-on-rename
description: >
  Plan §3 gate criterion 6: a function rename → the selector with
  `qualified_name` + `function_signature` anchors re-binds via the
  fingerprint fallback at confidence ≥ 0.75. The validate-diff pipeline
  emits a `selector_reanchored` finding identifying the fingerprint that
  paid for the rebind.
  Plan calls out TypeScript as the example; the resolver + pipeline
  behavior is language-agnostic and Go gives a reliable e2e environment
  (LSP/SCIP/tree-sitter all available without extra toolchains).
  The fixture's source-of-truth is the post-rename state — the workspace
  is initialized AFTER the rename so the indexer sees only the renamed
  function (avoids stale-entity carryover from a pre-rename indexing
  pass; entity garbage-collection on rename lands in a later phase).
tags: [phase1, change-process, gate-criterion-6, reanchor]
order: 50
requires:
  - cgo
  - tree-sitter
  - feature:p1-multi-language
repo:
  helper: go-module-with-checkout-validator

setup:
  # 1. Apply the rename to the source BEFORE init so the indexer's first
  #    pass sees the renamed function and code.core never observes the
  #    pre-rename name. The diff itself is preserved as rename.diff so the
  #    validate-diff step has a unified-diff input to feed.
  - name: stage_rename
    command: |
      bash -c '
      cat > rename.diff << "DIFFEOF"
      --- a/internal/checkout/validator.go
      +++ b/internal/checkout/validator.go
      @@ -3,7 +3,7 @@ package checkout
       // CheckoutValidator validates pre-payment cart state.
       type CheckoutValidator struct{}

      -// Validate runs the cart validation pipeline.
      -func (v *CheckoutValidator) Validate(cart any) error {
      +// ValidateV2 runs the cart validation pipeline (renamed).
      +func (v *CheckoutValidator) ValidateV2(cart any) error {
       	if cart == nil {
       		return nil
       	}
      DIFFEOF
      patch -p1 < rename.diff
      '
    assert: [{ type: exit_code, expected: 0 }]

  - name: init_workspace
    command: graph-harness init
    assert: [{ type: exit_code, expected: 0 }]

  - name: install_overlay_pointing_at_pre_rename_name
    # The selector intentionally uses the OLD qualified_name. Resolution
    # must fall through to the function_signature anchor.
    command: |
      bash -c '
      mkdir -p .graph-harness/overlay
      cat > .graph-harness/overlay/checkout.gh << "GHEOF"
      selector CheckoutValidator {
        anchor qualified_name "checkout.CheckoutValidator.Validate"
        anchor function_signature sig(any) -> error
      }
      GHEOF
      '
    assert: [{ type: exit_code, expected: 0 }]

steps:
  - name: selectors_test_resolves_reanchored_via_fingerprint
    command: graph-harness selectors test CheckoutValidator --explain
    assert:
      - { type: exit_code, expected: 0 }
      # Gate criterion 6 + 8: outcome reanchored via function_signature
      # at confidence ≥ 0.75. Default function_signature score is 0.85.
      - { type: contains, value: "outcome:    reanchored" }
      - { type: contains, value: "via_anchor:       function_signature" }
      - { type: contains, value: "confidence:       0.85" }
      # Trace must record the qualified_name miss and the fallback win.
      - { type: contains, value: "no candidates" }
      - { type: contains, value: "fallback scored 0.85" }

  - name: validate_diff_emits_selector_reanchored_finding
    command: graph-harness validate-diff --diff rename.diff --json
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "\"kind\":\"selector_reanchored\"" }
      - { type: contains, value: "outcome=reanchored" }
      - { type: contains, value: "anchor=function_signature" }
      # Gate criterion 6: confidence ≥ 0.75. function_signature default is 0.85.
      - { type: contains, value: "confidence=0.85" }

  - name: explain_json_records_full_trace
    command: graph-harness selectors test CheckoutValidator --json --explain
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "\"outcome\":\"reanchored\"" }
      - { type: contains, value: "\"via_anchor\":\"function_signature\"" }
      - { type: contains, value: "\"kind\":\"qualified_name\"" }
      - { type: contains, value: "\"skipped\":true" }
      - { type: contains, value: "\"kind\":\"function_signature\"" }
