# yaml-language-server: $schema=https://github.com/shivamstaq/gotit/raw/main/schema/spec.schema.json
spec_version: 1
name: change-process-finding-kinds-shape
description: >
  P1.G: change.process emits the new finding kinds with the SPEC §8.2
  ValidationFinding shape — kind/severity/subject/evidence/repair fields
  populated correctly. Tests via the existing tracer-validate-diff fixture
  (no diff reaches symbol_disambiguation or unresolved_anchor in the happy
  path; this spec just guards the shape and that flow_unreviewed still
  fires under the new pipeline wiring).
tags: [phase1, change-process, p1t30, p1t31]
order: 40
requires:
  - cgo
  - tree-sitter
  - feature:p1-multi-language
repo:
  helper: go-module-with-checkout-validator

setup:
  - name: init_workspace
    command: graph-harness init
    assert:
      - { type: exit_code, expected: 0 }

  - name: install_overlay
    command: sh -c "mkdir -p .graph-harness/overlay && cp demo.checkout.gh .graph-harness/overlay/checkout.gh"
    assert:
      - { type: exit_code, expected: 0 }

steps:
  - name: validate_diff_emits_well_shaped_findings
    command: graph-harness validate-diff --diff demo.diff --json
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "\"kind\":\"flow_unreviewed\"" }
      - { type: contains, value: "\"severity\":\"medium\"" }
      - { type: contains, value: "\"evidence\"" }
      - { type: contains, value: "\"repair\":{}" }
