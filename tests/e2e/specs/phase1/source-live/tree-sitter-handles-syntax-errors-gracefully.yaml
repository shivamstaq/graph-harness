# yaml-language-server: $schema=https://github.com/shivamstaq/gotit/raw/main/schema/spec.schema.json
spec_version: 1
name: tree-sitter-handles-syntax-errors-gracefully
description: 'When a workspace contains a Go file with a syntax error, source.live tree-sitter still extracts well-formed entities from the surrounding code without crashing. (Plan §5 risk: tree-sitter grammar quirks must degrade, not abort.)'
tags: [phase1, source-live, tree-sitter, p1t14]
order: 13
requires:
  - cgo
  - tree-sitter
  - feature:p1-multi-language
repo:
  helper: go-module-with-checkout-validator

setup:
  - name: init_workspace
    command: graph-harness init
    assert: [{ type: exit_code, expected: 0 }]
  # Plant a deliberately malformed Go file alongside the well-formed
  # validator.go. The tree-sitter parser must skip the broken file (or
  # extract what it can) and still surface the CheckoutValidator entity
  # the helper provides.
  - name: plant_malformed_file
    command: sh -c "printf 'package checkout\n\nfunc bad( {\n  this is not valid Go\n}\n' > internal/checkout/broken.go"
    assert: [{ type: exit_code, expected: 0 }]
  - name: install_overlay
    command: sh -c "mkdir -p .graph-harness/overlay && cp demo.checkout.gh .graph-harness/overlay/checkout.gh"
    assert: [{ type: exit_code, expected: 0 }]

steps:
  # Resolution still succeeds even though broken.go can't be fully
  # parsed — the well-formed validator.go is still indexed.
  - name: selectors_test_still_resolves_despite_syntax_error
    command: graph-harness selectors test CheckoutValidator --json
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "CheckoutValidator" }
  # Status command must not crash either; the workspace is healthy
  # despite the malformed file.
  - name: status_reports_workspace_healthy
    command: graph-harness status
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "Workspace:" }
