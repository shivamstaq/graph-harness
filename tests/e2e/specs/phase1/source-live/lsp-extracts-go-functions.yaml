# yaml-language-server: $schema=https://github.com/shivamstaq/gotit/raw/main/schema/spec.schema.json
spec_version: 1
name: lsp-extracts-go-functions
description: 'When gopls is on PATH, source.live LSP host extracts Go function symbols and code.core stores entities with extractor:lsp provenance.'
tags: [phase1, source-live, lsp, p1t02]
order: 10
requires:
  - cgo
  - tree-sitter
  - gopls
  - feature:p1-multi-language
repo:
  helper: go-module-with-checkout-validator

setup:
  - name: init_workspace
    command: graph-harness init
    assert: [{ type: exit_code, expected: 0 }]
  # The helper pre-stages demo.checkout.gh in the workspace root; install
  # it under .graph-harness/overlay/ so `selectors test` finds the
  # selector. Mirrors the lsp-extracts-{ts,python}-functions specs.
  - name: install_overlay
    command: sh -c "mkdir -p .graph-harness/overlay && cp demo.checkout.gh .graph-harness/overlay/checkout.gh"
    assert: [{ type: exit_code, expected: 0 }]

steps:
  # Strong probe: outcome=bound + the extracted qualified_name in the
  # match array. `contains "CheckoutValidator"` alone would false-pass
  # on the printed selector_id — these two assertions together verify
  # that source_live → code.core ingestion produced an entity AND that
  # the resolver matched the selector against it.
  - name: selectors_test_resolves_to_extracted_go_entity
    command: graph-harness selectors test CheckoutValidator --json
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: '"outcome":"bound"' }
      - { type: contains, value: '"qualified_name":"checkout.CheckoutValidator.Validate"' }
      - { type: contains, value: '"via_anchor":"qualified_name"' }

  # Provenance probe: gopls's DocumentSymbol response carries the
  # CheckoutValidator struct as a Class symbol; tree-sitter doesn't
  # emit type declarations, so this entity's source list is solely
  # live_lsp. Asserting on the Class entity sidesteps the
  # function-level signature-alignment caveat — see the comment in
  # internal/extract/orchestrator.go::filterOutFunctions for context.
  - name: code_provenance_carries_live_lsp_source
    command: graph-harness code provenance "checkout.CheckoutValidator" --json
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: '"source_class":"live_lsp"' }
      - { type: contains, value: '"produced_by":"extractor:lsp:gopls"' }
