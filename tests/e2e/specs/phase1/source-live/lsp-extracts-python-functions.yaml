# yaml-language-server: $schema=https://github.com/shivamstaq/gotit/raw/main/schema/spec.schema.json
spec_version: 1
name: lsp-extracts-python-functions
description: 'When pyright is on PATH, source.live LSP host extracts Python function symbols.'
tags: [phase1, source-live, lsp, p1t04]
order: 12
requires:
  - cgo
  - tree-sitter
  - pyright
  - feature:p1-multi-language
repo:
  helper: python-module-with-checkout-validator

setup:
  - name: init_workspace
    command: graph-harness init
    assert: [{ type: exit_code, expected: 0 }]
  - name: install_overlay
    command: sh -c "mkdir -p .graph-harness/overlay && cp demo.checkout.gh .graph-harness/overlay/checkout.gh"
    assert: [{ type: exit_code, expected: 0 }]

steps:
  # Strong probe: outcome=bound + the parser-extracted qualified_name
  # (dotted-path module rule: `checkout/validator.py` →
  # `checkout.validator.<class>.<method>`) + via_anchor confirming the
  # qualified_name anchor resolved (rather than a fallback). Mirrors the
  # lsp-extracts-{go,ts}-functions strong-probe template.
  - name: selectors_test_resolves_to_extracted_python_entity
    command: graph-harness selectors test CheckoutValidator --json
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: '"outcome":"bound"' }
      - { type: contains, value: '"qualified_name":"checkout.validator.CheckoutValidator.validate"' }
      - { type: contains, value: '"via_anchor":"qualified_name"' }
