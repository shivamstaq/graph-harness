# yaml-language-server: $schema=https://github.com/shivamstaq/gotit/raw/main/schema/spec.schema.json
spec_version: 1
name: scenario-1-three-languages
description: >
  Phase-1 bench scenario 1 (auth-sensitive edit) scored across all three
  language variants in one invocation. `graph-harness bench --scenario 1
  --regime mature --language all` loads each variant under
  tests/testdata/bench/scenario1/<lang>/, runs change.process against
  its target.diff, scores against its oracle.json, and emits a
  per_language.<lang>.detection_axis.score plus an aggregate fold.
  Plan §3 gate criterion 10 ("oracle pass rates ≥ 0.8 per language") is
  the wave-gate this spec asserts.
tags: [phase1, bench, polyglot, p1t41]
order: 50
requires:
  - cgo
  - tree-sitter
  - feature:p1-multi-language

# The bench command discovers the scenario root by walking up from cwd
# looking for `tests/testdata/bench/scenario1/`. Running from any
# directory inside the repo works; the helper supplies a stand-in workspace
# only because gotit needs *some* repo for setup invariants.
repo:
  helper: go-module-empty

steps:
  # The bench command discovers the scenario corpus via a fallback chain:
  # --scenario-root → cwd walk → project-root walk → the
  # GRAPH_HARNESS_E2E_PROJECT_ROOT env var the gotit runner exports. Path
  # 4 is what makes this spec work from a tmpdir.
  - name: bench_three_languages_aggregate
    command: graph-harness bench --scenario 1 --regime mature --language all
    assert:
      - { type: exit_code, expected: 0 }
      # Per-language detection-axis scores meet criterion 10.
      - { type: contains, value: '"per_language"' }
      - { type: contains, value: '"go"' }
      - { type: contains, value: '"typescript"' }
      - { type: contains, value: '"python"' }
      # Aggregate fold (sum(detected) / sum(expected)) is the cross-
      # language gate-bar — 1.0 means every variant detected its
      # expected flow_unreviewed finding.
      - { type: contains, value: '"aggregate"' }
      - { type: contains, value: '"detection_axis"' }
      - { type: contains, value: '"score": 1' }
      # flow_unreviewed:CheckoutValidation appears once per language.
      - { type: contains, value: 'flow_unreviewed:CheckoutValidation' }

  - name: bench_single_language_filter
    command: graph-harness bench --scenario 1 --regime mature --language go
    assert:
      - { type: exit_code, expected: 0 }
      # --language go emits the bare per-scenario shape (back-compatible
      # with the pre-P1 bench output).
      - { type: contains, value: '"detection_axis"' }
      - { type: contains, value: 'flow_unreviewed:CheckoutValidation' }
