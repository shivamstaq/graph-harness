# yaml-language-server: $schema=https://github.com/shivamstaq/gotit/raw/main/schema/spec.schema.json
spec_version: 1
name: useful-output-with-only-scip
description: >
  SPEC §6.11 build-order tolerance, symmetric variant: code.core must produce
  useful output when only SCIP is available (tree-sitter and LSP disabled).
  Verifies that the SCIP-only ingestion path materializes entities and reports
  a single index_scip provenance row.
tags: [phase1, code-core, single-source, scip]
order: 35
requires:
  - cgo
  - scip-go
  - feature:p1-multi-language
  - feature:p1-extractor-wiring
repo:
  helper: go-module-with-checkout-validator

setup:
  - name: init_workspace
    command: graph-harness init
    assert: [{ type: exit_code, expected: 0 }]
  - name: install_overlay
    command: sh -c "mkdir -p .graph-harness/overlay && cp demo.checkout.gh .graph-harness/overlay/checkout.gh"
    assert: [{ type: exit_code, expected: 0 }]
  - name: refresh_scip_index
    command: graph-harness scip refresh
    assert: [{ type: exit_code, expected: 0 }]

steps:
  - name: selector_resolves_with_only_scip
    command: graph-harness selectors test CheckoutValidator --no-treesitter --no-lsp --json
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "CheckoutValidator" }
      - { type: contains, value: "\"outcome\":\"bound\"" }

  - name: provenance_carries_only_scip
    command: graph-harness code provenance "checkout.CheckoutValidator.Validate" --no-treesitter --no-lsp --json
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "\"source_count\":1" }
      - { type: contains, value: "\"source_class\":\"index_scip\"" }

  - name: tree_sitter_and_lsp_not_in_provenance
    command: sh -c "graph-harness code provenance 'checkout.CheckoutValidator.Validate' --no-treesitter --no-lsp --json | grep -c 'structural_treesitter\\|live_lsp' || true"
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "0" }
