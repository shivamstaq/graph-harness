# yaml-language-server: $schema=https://github.com/shivamstaq/gotit/raw/main/schema/spec.schema.json
spec_version: 1
name: p2-extractor-extracts-flask-routes
description: >-
  Pass-2 routes/py/flask: a Flask app with `@app.route` decorators
  indexes to Route entities under code.framework. We assert via
  `code list --json` that the rows materialize with method + path and
  framework=flask. Mirrors extractors/route/py/flask/testdata/app.py.
tags: [phase2, extractors, routes, flask, p2-framework-extractors]
order: 212
requires:
  - feature:p2-framework-extractors
repo:
  helper: go-module-empty

setup:
  - name: init_workspace
    command: graph-harness init
    assert:
      - { type: exit_code, expected: 0 }

  - name: write_flask_routes_fixture
    command: |
      sh -c 'mkdir -p api && cat > api/app.py <<"PYEOF"
      """Flask app fixture."""

      from flask import Flask

      app = Flask(__name__)


      @app.route("/health")
      def health():
          return "ok"


      @app.route("/login", methods=["POST"])
      def login():
          return {"token": "xxx"}


      @app.route("/orders", methods=["GET", "POST"])
      def orders():
          return []


      @app.route("/orders/<int:order_id>", methods=["GET", "PUT", "PATCH"])
      def get_order(order_id):
          return {"id": order_id}
      PYEOF
      cat > api/pyproject.toml <<"TOML"
      [project]
      name = "flask-fixture"
      version = "0.1.0"
      TOML'
    assert:
      - { type: exit_code, expected: 0 }

  - name: commit_fixture
    command: sh -c "git add -A && git -c user.email=ci@example.com -c user.name=ci commit -m 'flask routes fixture' >/dev/null"
    assert:
      - { type: exit_code, expected: 0 }

steps:
  - name: code_list_reports_flask_route_rows
    command: graph-harness code list --batch --json --no-lsp
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "\"kind\":\"Route\"" }
      # Flask fans methods=[...] out into one Route per method, so the
      # four @app.route decorators produce SEVEN composite rows. Each is
      # pinned by its exact "<METHOD> <path>" qualified_name, so a dropped
      # method (e.g. losing one of GET/PUT/PATCH on /orders/<id>) or a
      # mangled path fails the spec. `/health` with no methods=[] defaults
      # to GET. The `<int:order_id>` converter is JSON-escaped in stdout
      # (`<…>`), matched here via the literal backslash sequence.
      - { type: contains, value: "\"qualified_name\":\"GET /health\"" }
      - { type: contains, value: "\"qualified_name\":\"POST /login\"" }
      - { type: contains, value: "\"qualified_name\":\"GET /orders\"" }
      - { type: contains, value: "\"qualified_name\":\"POST /orders\"" }
      - { type: contains, value: "\"qualified_name\":\"GET /orders/\\u003cint:order_id\\u003e\"" }
      - { type: contains, value: "\"qualified_name\":\"PUT /orders/\\u003cint:order_id\\u003e\"" }
      - { type: contains, value: "\"qualified_name\":\"PATCH /orders/\\u003cint:order_id\\u003e\"" }
      # Methods surface via kind_tag.
      - { type: contains, value: "\"kind_tag\":\"GET\"" }
      - { type: contains, value: "\"kind_tag\":\"POST\"" }
      - { type: contains, value: "\"kind_tag\":\"PUT\"" }
      - { type: contains, value: "\"kind_tag\":\"PATCH\"" }
      # Flask routes are attributed to Python.
      - { type: contains, value: "\"language_id\":\"python\"" }

  - name: extractors_list_includes_flask
    command: graph-harness extractors list
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "flask" }
      - { type: contains, value: "routes" }
