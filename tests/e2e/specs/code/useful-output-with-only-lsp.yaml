# yaml-language-server: $schema=https://github.com/shivamstaq/gotit/raw/main/schema/spec.schema.json
spec_version: 1
name: useful-output-with-only-lsp
description: >
  SPEC §6.11 build-order tolerance, symmetric variant: code.core must produce
  useful output when only LSP is available (tree-sitter and SCIP disabled).
  Verifies that the LSP-only ingestion path materializes entities and reports
  a single live_lsp provenance row.
tags: [code, single-source, lsp]
order: 34
requires:
  - cgo
  - gopls
  - feature:have-gopls
  - feature:p1-multi-language
  - feature:p1-extractor-wiring
repo:
  helper: go-module-with-checkout-validator

setup:
  - name: init_workspace
    command: graph-harness init
    assert: [{ type: exit_code, expected: 0 }]
  - name: install_overlay
    command: sh -c "mkdir -p .graph-harness/overlay && cp demo.checkout.gh .graph-harness/overlay/checkout.gh"
    assert: [{ type: exit_code, expected: 0 }]

steps:
  - name: selector_resolves_with_only_lsp
    command: graph-harness selectors test CheckoutValidator --no-treesitter --no-scip --json
    env: { GRAPH_HARNESS_ENABLE_LSP: "1" }
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "CheckoutValidator" }
      - { type: contains, value: "\"outcome\":\"bound\"" }

  - name: provenance_carries_only_lsp
    command: graph-harness code provenance "checkout.CheckoutValidator.Validate" --no-treesitter --no-scip --json
    env: { GRAPH_HARNESS_ENABLE_LSP: "1" }
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "\"source_count\":1" }
      - { type: contains, value: "\"source_class\":\"live_lsp\"" }

  - name: tree_sitter_and_scip_not_in_provenance
    command: sh -c "graph-harness code provenance 'checkout.CheckoutValidator.Validate' --no-treesitter --no-scip --json | grep -c 'structural_treesitter\\|index_scip' || true"
    env: { GRAPH_HARNESS_ENABLE_LSP: "1" }
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "0" }
