apiVersion: graph-harness.kernel/v1
kind: Layer
metadata:
  name: source.live
  version: 0.1.0
  depends_on: []          # leaf layer; emits raw extractor facts
  description: >
    Live extractor facts from LSP, filesystem, parser snapshots, diagnostics,
    and watcher events. Three independent fact sources unify in code.core via
    content-addressable keys (SPEC §6.11): LSP (live), SCIP (indexed), and
    tree-sitter (structural). Tree-sitter covers Go, TypeScript / TSX / JSX,
    and Python.

# Raw events carry payload schemas inline; the unified Symbol envelope
# (internal/source_live/symbol.go) is the contract code.core consumes.
schema:
  entity_kinds: []
  relation_kinds: []

capabilities:
  - kv_lookup_by_id
  - streaming_subscribe

events:
  emits:
    - FileChanged
    - FileParsed
    - SymbolDisambiguation   # P1: emitted when LSP/SCIP/tree-sitter disagree

storage:
  adapter: in_memory       # plus WAL spill; ephemeral by design
  durability: ephemeral
  mutability: append_only

snapshot:
  supports_as_of_seq: false
  strategy: external_source
  retention:
    events: 0              # never compacted into snapshots; raw stream only
    duration: "0h"

trust:
  direct_writes_from:
    - extractor:tree_sitter
    - extractor:lsp        # P1
    - extractor:scip       # P1
    - kernel_replay
  review_required_from: []
  forbidden_from:
    - user
    - agent

sync:
  mode: local_only         # never synced (SPEC §6.6)

freshness_states:
  - live
  - cached
  - dirty
  - unavailable
