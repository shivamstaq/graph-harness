<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>graph-harness studio</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <h1>graph-harness <span class="muted">studio</span></h1>
    <nav>
      <button data-page="editor" class="active">Overlay editor</button>
      <button data-page="preview">Selector preview</button>
      <button data-page="entity">Entity drill-down</button>
    </nav>
    <div id="status" class="muted"></div>
  </header>

  <main>
    <!-- Page: overlay editor -->
    <section id="page-editor" class="page active">
      <div class="row">
        <input id="rel-path" placeholder="checkout.gh" value="checkout.gh" />
        <button id="save">Save .gh</button>
        <span id="save-msg" class="muted"></span>
      </div>
      <textarea id="editor" spellcheck="false">selector CheckoutValidator {
  unique
  anchor qualified_name "CheckoutValidator.Validate"
  anchor symbol_fingerprint "f:Validate/sig=any:error"
  anchor body_hash "sha256:replace-me"
}

flow CheckoutValidation {
  description "Pre-payment cart validation"
  scope CheckoutValidator
  step ValidateCart targets selector { qualified_name "CheckoutValidator.Validate" }
}
</textarea>
      <h3>Anchor coverage</h3>
      <p class="muted">Selectors without a fingerprint anchor will not survive function-rename. (P1.I/T34.)</p>
      <ul id="coverage"></ul>
    </section>

    <!-- Page: selector preview -->
    <section id="page-preview" class="page">
      <div class="row">
        <select id="anchor-kind">
          <option value="qualified_name">qualified_name</option>
          <option value="qualified_name_suffix">qualified_name_suffix</option>
        </select>
        <input id="anchor-value" placeholder="CheckoutValidator.Validate" size="60" />
        <button id="preview-btn">Resolve</button>
      </div>
      <pre id="preview-out"></pre>
    </section>

    <!-- Page: entity drill-down -->
    <section id="page-entity" class="page">
      <div class="row">
        <input id="entity-qn" placeholder="CheckoutValidator.Validate" size="60" />
        <button id="entity-btn">Look up</button>
      </div>
      <pre id="entity-out"></pre>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
