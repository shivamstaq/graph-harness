apiVersion: graph-harness.kernel/v1
kind: Layer
metadata:
  name: code.core
  version: 0.2.0
  depends_on:
    - source.live@^0.1.0
  description: >
    Normalized language-level code graph derived from source.live. Three-source
    unification (LSP + SCIP + tree-sitter) per SPEC §6.11–§6.12: when sources
    agree on the canonical content-addressable key, one entity is materialized
    with a merged provenance.sources[]; when sources disagree, both entities
    are recorded and a SymbolDisambiguation event is emitted.

schema:
  entity_kinds:
    - name: File
      attributes:
        path:        { type: path,   indexed: true }
        language_id: { type: string, indexed: true }
    - name: Function
      attributes:
        qualified_name:       { type: string, indexed: true }
        normalized_signature: { type: string, indexed: true }
        language_id:          { type: string, indexed: true }
        body_hash:            { type: string, indexed: false }
    - name: Method
      attributes:
        qualified_name:       { type: string, indexed: true }
        receiver:             { type: string, indexed: true }
        method_name:          { type: string, indexed: true }
        normalized_signature: { type: string, indexed: false }
        language_id:          { type: string, indexed: true }
    - name: TypeDecl
      attributes:
        qualified_name: { type: string, indexed: true }
        kind_tag:       { type: enum,   indexed: true }      # struct|interface|alias
        language_id:    { type: string, indexed: true }
    - name: Class
      attributes:
        qualified_name: { type: string, indexed: true }
        kind_tag:       { type: enum,   indexed: true }
        language_id:    { type: string, indexed: true }
    - name: Interface
      attributes:
        qualified_name: { type: string, indexed: true }
        kind_tag:       { type: enum,   indexed: true }
        language_id:    { type: string, indexed: true }
    - name: Symbol                                            # §6.12 catch-all
      attributes:
        qualified_name: { type: string, indexed: true }
        kind_tag:       { type: string, indexed: true }
        language_id:    { type: string, indexed: true }
        parent_id:      { type: string, indexed: true }       # anonymous entities
        ordinal:        { type: int,    indexed: false }
  relation_kinds:
    - name: calls
      from: Function
      to:   Function
      attributes: {}
    - name: references
      from: Function
      to:   Function
      attributes: {}

# Provenance schema: code.core records every fact source's claim on
# every materialized entity in a (entity_id, source_class)-keyed table.
# These are the only valid source_class values; extractors emitting
# anything else are ignored (and the unifier returns no provenance row
# for that source).
provenance_schema:
  source_classes:
    - id: live_lsp
      from_layer: source.live
      default_freshness: live
      description: Language-Server-Protocol facts (gopls, tsserver, pyright).
    - id: index_scip
      from_layer: source.live
      default_freshness: current
      description: SCIP indexer output for committed state.
    - id: structural_treesitter
      from_layer: source.live
      default_freshness: live
      description: Tree-sitter structural parsing — type-unaware fallback.
  entry_fields:
    - { name: source_class,  type: enum,   required: true }
    - { name: confidence,    type: float,  required: true,  range: [0.0, 1.0] }
    - { name: last_seen_seq, type: uint64, required: true }
    - { name: freshness,     type: enum,   required: true }
    - { name: produced_by,   type: string, required: false }

# Three-source unification rule, conflict-as-event (SPEC §6.12).
unify:
  # Materialize a SymbolDisambiguation event when at least this many
  # distinct canonical IDs are observed at the same source-text
  # location. Default 2 — any disagreement at all surfaces. Raise to
  # 3 to suppress noise during the launch window per SPEC §5 risks.
  disagreement_threshold: 2

capabilities:
  - kv_lookup_by_id
  - filter_by_attribute:
      fields: [qualified_name, language_id, path, kind_tag, parent_id]
      ops: [eq, prefix, glob]
  - traversal:
      edge_kinds: [calls, references]
      max_depth: 8
  - selector_match:
      families: [structural, nominal, signature, kindwise, relational]
  - as_of_seq_read
  - streaming_subscribe
  - batch_ingest
  - provenance_lookup           # GetProvenance(entity_id) -> []SourceEntry

events:
  emits:
    - EntityMaterialized
    - EntitySuperseded         # rename / signature change → new ID + supersession
    - SymbolDisambiguation     # emitted when ≥ disagreement_threshold sources disagree

storage:
  adapter: sqlite
  durability: persistent
  mutability: derived

snapshot:
  supports_as_of_seq: true
  strategy: event_replay
  retention:
    events: 100000
    duration: "720h"            # 30 days

trust:
  direct_writes_from:
    - kernel_replay
    - layer:source.live
  review_required_from: []
  forbidden_from:
    - user
    - agent

sync:
  mode: local_only              # per-workspace (SPEC §6.6)

freshness_states:
  - current
  - building
  - dirty
  - stale
